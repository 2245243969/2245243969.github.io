<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="650" viewBox="0 0 1000 650" role="img" aria-labelledby="title"><title id="title">VAE architecture / 变分自编码器架构</title><defs><marker id="arrow" markerWidth="9" markerHeight="9" refX="8" refY="4" orient="auto"><path d="M0 0L8 4L0 8" fill="none" stroke="#34495a" stroke-width="1.5"/></marker></defs><style>text{font-family:Arial,'Microsoft YaHei',sans-serif;fill:#172b3a}.t{font-size:25px;font-weight:700}.s{font-size:18px;fill:#506273}.m{font-family:Georgia,'Times New Roman',serif;font-style:italic;font-size:26px}.box{stroke:#34495a;stroke-width:1.6;fill:#f3f7fa}.a{fill:none;stroke:#34495a;stroke-width:2;marker-end:url(#arrow)}.dash{stroke-dasharray:7 6}</style><rect width="1000" height="650" fill="#fff"/>
<text x="40" y="45" class="t">VAE · 变分自编码器 / Variational Autoencoder</text>
<text x="40" y="90" class="s">训练路径 / Training</text>
<rect x="35" y="150" width="80" height="90" rx="8" class="box"/><text x="75" y="184" text-anchor="middle" class="s">输入</text><text x="75" y="220" text-anchor="middle" class="m">x</text><path d="M118 195H155" class="a"/>
<rect x="170" y="135" width="155" height="120" rx="8" fill="#e5eff8" stroke="#34495a"/><text x="248" y="171" text-anchor="middle">编码器 / Encoder</text><text x="248" y="204" text-anchor="middle" class="m">q<tspan baseline-shift="sub" font-size="65%">φ</tspan>(z | x)</text><text x="248" y="235" text-anchor="middle" class="s">输出 / Outputs μ, σ</text><path d="M327 195H375" class="a"/>
<rect x="390" y="135" width="210" height="120" rx="8" fill="#f9eedc" stroke="#916b30"/><text x="495" y="171" text-anchor="middle">采样 / Sampling</text><text x="495" y="209" text-anchor="middle" class="m">z = μ + σ ⊙ ε</text><text x="495" y="238" text-anchor="middle" class="s" style="font-size:16px">重参数化 / Reparameterize</text>
<rect x="390" y="65" width="210" height="42" rx="5" class="box"/><text x="495" y="93" text-anchor="middle" class="m">ε ∼ N(0, I)</text><path d="M495 109V130" class="a"/>
<path d="M602 195H650" class="a"/><rect x="665" y="135" width="165" height="120" rx="8" fill="#e5eff8" stroke="#34495a"/><text x="748" y="174" text-anchor="middle">解码器 / Decoder</text><text x="748" y="213" text-anchor="middle" class="m">p<tspan baseline-shift="sub" font-size="65%">θ</tspan>(x | z)</text><path d="M832 195H870" class="a"/>
<rect x="885" y="150" width="80" height="90" rx="8" class="box"/><text x="925" y="185" text-anchor="middle" class="s">重构</text><text x="925" y="220" text-anchor="middle" class="m">x̂</text>
<path d="M248 258V290H495V323" class="a dash"/><rect x="333" y="335" width="330" height="60" rx="6" class="box"/><text x="498" y="372" text-anchor="middle" class="m">D<tspan baseline-shift="sub" font-size="65%">KL</tspan>(q<tspan baseline-shift="sub" font-size="65%">φ</tspan>(z | x) ∥ p(z))</text>
<path d="M925 255V310H715" fill="none" stroke="#98a4af" stroke-dasharray="6 5"/><text x="800" y="341" text-anchor="middle" class="s">重构项 / Reconstruction term</text>
<path d="M40 425H960" stroke="#d6dee4"/>
<text x="40" y="465" class="s">生成路径 / Generation</text>
<rect x="80" y="505" width="260" height="75" rx="8" fill="#f9eedc" stroke="#916b30"/><text x="210" y="535" text-anchor="middle">从先验采样 / Sample from prior</text><text x="210" y="564" text-anchor="middle" class="m">z ∼ p(z) = N(0, I)</text>
<path d="M343 542H455" class="a"/><rect x="470" y="505" width="230" height="75" rx="8" fill="#e5eff8" stroke="#34495a"/><text x="585" y="535" text-anchor="middle">同一个解码器 / Same decoder</text><text x="585" y="564" text-anchor="middle" class="m">p<tspan baseline-shift="sub" font-size="65%">θ</tspan>(x | z)</text><path d="M703 542H815" class="a"/><text x="890" y="535" text-anchor="middle">生成数据</text><text x="890" y="565" text-anchor="middle" class="s">Generated data</text>
<text x="500" y="625" text-anchor="middle" class="s">示意：采用对角高斯近似后验 / Schematic with a diagonal Gaussian approximate posterior</text></svg>