<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="550" viewBox="0 0 1000 550" role="img" aria-labelledby="title"><title id="title">Variational inference / 变分推断示意图</title><defs><marker id="arrow" markerWidth="9" markerHeight="9" refX="8" refY="4" orient="auto"><path d="M0 0L8 4L0 8" fill="none" stroke="#34495a" stroke-width="1.5"/></marker></defs><style>text{font-family:Arial,'Microsoft YaHei',sans-serif;fill:#172b3a}.t{font-size:25px;font-weight:700}.s{font-size:18px;fill:#506273}.m{font-family:Georgia,'Times New Roman',serif;font-style:italic;font-size:26px}.box{stroke:#34495a;stroke-width:1.6;fill:#f3f7fa}.a{fill:none;stroke:#34495a;stroke-width:2;marker-end:url(#arrow)}.dash{stroke-dasharray:7 6}</style><rect width="1000" height="550" fill="#fff"/>
<text x="40" y="45" class="t">在分布族 Q 中寻找近似后验 / Variational Approximation</text>
