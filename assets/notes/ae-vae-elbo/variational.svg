<text x="185" y="328" class="m" style="font-size:42px">Q</text><text x="170" y="355" class="s">变分分布族</text><text x="170" y="380" class="s">Variational family</text>
<circle cx="335" cy="380" r="7" fill="#34495a"/><text x="355" y="395" class="m">q<tspan baseline-shift="sub" font-size="65%">0</tspan>(z | x)</text>
<circle cx="565" cy="187" r="8" fill="#32698f"/><text x="530" y="235" class="m">q*(z | x)</text>
<circle cx="610" cy="105" r="8" fill="#a66b25"/><text x="635" y="103" class="m">p<tspan baseline-shift="sub" font-size="65%">θ</tspan>(z | x)</text><text x="635" y="133" class="s">真实后验 / True posterior</text>
<path d="M569 176L603 119" class="a dash"/>
<path d="M600 175H700" class="a"/><text x="715" y="184" class="m" style="font-size:23px">D<tspan baseline-shift="sub" font-size="65%">KL</tspan>(q* ∥ p<tspan baseline-shift="sub" font-size="65%">θ</tspan>)</text>
<text x="500" y="515" text-anchor="middle" class="m">min<tspan baseline-shift="sub" font-size="65%">φ</tspan> D<tspan baseline-shift="sub" font-size="65%">KL</tspan>(q<tspan baseline-shift="sub" font-size="65%">φ</tspan>(z | x) ∥ p<tspan baseline-shift="sub" font-size="65%">θ</tspan>(z | x))</text></svg>