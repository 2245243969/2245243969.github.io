<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="380" viewBox="0 0 1000 380" role="img" aria-labelledby="title"><title id="title">AE architecture / 自编码器架构</title><defs><marker id="arrow" markerWidth="9" markerHeight="9" refX="8" refY="4" orient="auto"><path d="M0 0L8 4L0 8" fill="none" stroke="#34495a" stroke-width="1.5"/></marker></defs><style>text{font-family:Arial,'Microsoft YaHei',sans-serif;fill:#172b3a}.t{font-size:25px;font-weight:700}.s{font-size:18px;fill:#506273}.m{font-family:Georgia,'Times New Roman',serif;font-style:italic;font-size:26px}.box{stroke:#34495a;stroke-width:1.6;fill:#f3f7fa}.a{fill:none;stroke:#34495a;stroke-width:2;marker-end:url(#arrow)}.dash{stroke-dasharray:7 6}</style><rect width="1000" height="380" fill="#fff"/>
<text x="40" y="45" class="t">AE · 自编码器 / Autoencoder</text>
<rect x="40" y="130" width="105" height="100" rx="8" class="box"/><text x="92" y="170" text-anchor="middle" class="s">输入 / Input</text><text x="92" y="210" text-anchor="middle" class="m">x</text>
<path d="M148 180H205" class="a"/><path d="M220 115L360 150V210L220 245Z" fill="#e5eff8" stroke="#34495a" stroke-width="1.6"/><text x="280" y="170" text-anchor="middle">编码器</text><text x="280" y="195" text-anchor="middle" class="s">Encoder f<tspan baseline-shift="sub" font-size="65%">φ</tspan></text>
<path d="M362 180H420" class="a"/><rect x="435" y="139" width="130" height="82" rx="8" fill="#f9eedc" stroke="#916b30"/><text x="500" y="172" text-anchor="middle" class="s">潜变量 / Code</text><text x="500" y="203" text-anchor="middle" class="m">z = f<tspan baseline-shift="sub" font-size="65%">φ</tspan>(x)</text>
<path d="M568 180H625" class="a"/><path d="M640 150L780 115V245L640 210Z" fill="#e5eff8" stroke="#34495a" stroke-width="1.6"/><text x="720" y="170" text-anchor="middle">解码器</text><text x="720" y="195" text-anchor="middle" class="s">Decoder g<tspan baseline-shift="sub" font-size="65%">θ</tspan></text><path d="M782 180H840" class="a"/>
<rect x="855" y="130" width="105" height="100" rx="8" class="box"/><text x="908" y="170" text-anchor="middle" class="s">重构</text><text x="908" y="207" text-anchor="middle" class="m">x̂</text>
<path d="M908 245V290H92V245" fill="none" stroke="#98a4af" stroke-width="1.5" stroke-dasharray="6 5"/><rect x="305" y="272" width="390" height="36" fill="white"/><text x="500" y="296" text-anchor="middle" class="s">比较输入与重构 / Reconstruction loss</text><text x="500" y="350" text-anchor="middle" class="s">固定参数、相同输入 → 确定的 z / Same input → deterministic code</text></svg>